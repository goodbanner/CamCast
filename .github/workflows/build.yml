name: build

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Build debug APK (retry on transient repo 429)
        shell: bash
        run: |
          for i in 1 2 3 4; do
            echo "== attempt $i =="
            if gradle assembleDebug --no-daemon; then
              exit 0
            fi
            if [ "$i" -lt 4 ]; then
              echo "build failed, retrying in 60s..."
              sleep 60
            fi
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CamCast-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
