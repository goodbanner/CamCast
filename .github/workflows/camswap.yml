name: camswap-build

on:
  push:
    paths:
      - 'camswap/**'
      - '.github/workflows/camswap.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Fetch Dobby (upstream git submodule, not vendored)
        run: |
          git clone https://github.com/jmpews/Dobby.git \
            camswap/app/src/main/cpp/third_party/Dobby
          cd camswap/app/src/main/cpp/third_party/Dobby
          git checkout cfb34699e3785d3b1bef962892fe986ff7f157aa

      - name: Install NDK 25.1.8937393 + CMake 3.22.1
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;25.1.8937393" "cmake;3.22.1"

      - name: Build debug + release APKs
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.jks
            export KEYSTORE_PATH=/tmp/release.jks
            echo "release keystore configured"
          else
            echo "no keystore secret -> unsigned release APK"
          fi
          cd camswap
          for i in 1 2 3; do
            echo "== attempt $i =="
            if gradle assembleDebug assembleRelease --no-daemon; then
              exit 0
            fi
            if [ "$i" -lt 3 ]; then sleep 60; fi
          done
          exit 1

      - name: Upload CamSwap debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CamSwap-debug
          path: camswap/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload CamSwap release APK
        uses: actions/upload-artifact@v4
        with:
          name: CamSwap-release
          path: camswap/app/build/outputs/apk/release/*.apk
          if-no-files-found: error