name: camswap-build

on:
  push:
    paths:
      - 'camswap/**'
      - '.github/workflows/camswap.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Fetch Dobby (pinned commit from upstream git submodule)
        run: |
          git clone https://github.com/jmpews/Dobby.git \
            camswap/app/src/main/cpp/third_party/Dobby
          cd camswap/app/src/main/cpp/third_party/Dobby
          git checkout cfb34699e3785d3b1bef962892fe986ff7f157aa

      - name: Install NDK 25.1.8937393 + CMake 3.22.1
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;25.1.8937393" "cmake;3.22.1"

      - name: Build debug APK (retry on transient repo errors)
        shell: bash
        run: |
          cd camswap
          for i in 1 2 3; do
            echo "== attempt $i =="
            if gradle assembleDebug --no-daemon; then
              exit 0
            fi
            if [ "$i" -lt 3 ]; then
              echo "build failed, retrying in 60s..."
              sleep 60
            fi
          done
          exit 1

      - name: Upload CamSwap APK (arm64-v8a only)
        uses: actions/upload-artifact@v4
        with:
          name: CamSwap-arm64
          path: camswap/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
